name: Release

# Publishes the binaries that scripts/install.sh downloads and that running
# agents self-update to. Asset names must stay in step with
# selfupdate.AssetName and the installer: nubit-agent_<goos>_<goarch>.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact immutable stable tag (vMAJOR.MINOR.PATCH) to build and publish once'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  resolve:
    name: Resolve and validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Validate stable tag and resolve commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "release tag must be vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          }

          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")
          object_type=$(jq -r '.object.type' <<<"$ref")
          object_sha=$(jq -r '.object.sha' <<<"$ref")
          case "$object_type" in
            commit)
              commit="$object_sha"
              ;;
            tag)
              tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
              [ "$(jq -r '.object.type' <<<"$tag_object")" = commit ] || {
                echo "stable tag does not resolve directly to a commit: $tag" >&2
                exit 1
              }
              commit=$(jq -r '.object.sha' <<<"$tag_object")
              ;;
            *)
              echo "stable tag does not resolve to a commit: $tag" >&2
              exit 1
              ;;
          esac

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  verify:
    name: Vet and test
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - run: go vet ./...
      - run: go test -race ./...

  release:
    name: Build and publish
    # A tag never publishes without a green suite; the binary it produces is
    # what every server will pull down unattended.
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Resolve the release tag
        id: release
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Regression test for unsafe release tag values
        env:
          RELEASE_TAG: "v1.2.3'; printf injected; #"
        run: |
          set -eu
          if printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'unsafe release tag was accepted' >&2
            exit 1
          fi

      - name: Build linux/amd64 and linux/arm64
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/nubitio/nubit-agent/internal/version.Version=${TAG}" \
              -o "dist/nubit-agent_linux_${arch}" \
              ./cmd/nubit-agent
          done

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum nubit-agent_linux_* > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: dist/nubit-agent.spdx.json

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/nubit-agent_linux_amd64
            dist/nubit-agent_linux_arm64
            dist/SHA256SUMS

      - name: Sign release artifacts
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.NUBIT_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$RELEASE_SIGNING_PRIVATE_KEY" ] || { echo 'NUBIT_RELEASE_SIGNING_PRIVATE_KEY is required' >&2; exit 1; }
          umask 077
          trap 'rm -f signing-key.pem' EXIT INT TERM
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > signing-key.pem
          for asset in dist/nubit-agent_linux_*; do
            openssl pkeyutl -sign -inkey signing-key.pem -rawin -in "$asset" -out "$asset.sig"
          done

      # Confirms the shipped binary reports the tag it was built from, so a
      # self-updating agent compares versions against something real.
      - name: Verify the embedded version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          reported=$(./dist/nubit-agent_linux_amd64 --version)
          echo "reported: $reported"
          [ "$reported" = "$TAG" ] || {
            echo "binary reports '$reported' but was tagged '$TAG'" >&2
            exit 1
          }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; releases are immutable" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes
