name: Release

# Publishes the binaries that scripts/install.sh downloads and that running
# agents self-update to. Asset names must stay in step with
# selfupdate.AssetName and the installer: nubit-agent_<goos>_<goarch>.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - run: go vet ./...
      - run: go test -race ./...

  release:
    name: Build and publish
    # A tag never publishes without a green suite; the binary it produces is
    # what every server will pull down unattended.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Resolve the release tag
        id: release
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build linux/amd64 and linux/arm64
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/nubitio/nubit-agent/internal/version.Version=${TAG}" \
              -o "dist/nubit-agent_linux_${arch}" \
              ./cmd/nubit-agent
          done

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum nubit-agent_linux_* > SHA256SUMS
          cat SHA256SUMS

      # Confirms the shipped binary reports the tag it was built from, so a
      # self-updating agent compares versions against something real.
      - name: Verify the embedded version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          reported=$(./dist/nubit-agent_linux_amd64 --version)
          echo "reported: $reported"
          [ "$reported" = "$TAG" ] || {
            echo "binary reports '$reported' but was tagged '$TAG'" >&2
            exit 1
          }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
