name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false

      # The agent ships as a static binary so it runs on any Debian 12 host
      # without a runtime dependency to keep in sync.
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/nubit-agent

  scripts:
    name: Installer script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse with sh
        run: |
          sh -n scripts/install.sh
          sh -n scripts/test-installer-ubuntu2604.sh
          sh -n scripts/test-installer-ubuntu2604-docker.sh
          sh -n scripts/test-installer-ubuntu2604-systemd.sh

      - name: ShellCheck
        run: shellcheck --shell=sh scripts/install.sh

      # --dry-run never touches the machine, so it is safe to exercise here and
      # proves argument parsing and platform detection still work. The version is
      # pinned so the check does not depend on a release existing.
      - name: Dry run
        run: sudo sh scripts/install.sh --dry-run --version v0.0.0-ci --control-url https://control.example.test --agent-token ci-agent-token

      # Exercise each supported distro in a disposable container. --dry-run
      # never changes the host, but covers the OS guard and package plan.
      - name: Dry run of the web profile on Debian 12
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12-slim sh -c '
            apt-get update -qq >/dev/null && apt-get install -y -qq curl >/dev/null
            sh scripts/install.sh --dry-run --profile web --version v0.0.0-ci
          '

      # The mail profile adds Stalwart to the same node. Exercised on Debian
      # because that is the tier it ships to first.
      - name: Dry run of the mail profile on Debian 12
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12-slim sh -c '
            apt-get update -qq >/dev/null && apt-get install -y -qq curl >/dev/null
            sh scripts/install.sh --dry-run --profile web,mail --mail-relay mail.example.com --version v0.0.0-ci
          '

      # A profile the agent does not know must be refused, not partly applied.
      - name: Refuses an unknown profile
        run: |
          if sudo sh scripts/install.sh --dry-run --profile mail --version v0.0.0-ci; then
            echo "an unknown profile was accepted" >&2
            exit 1
          fi
          echo "correctly refused"

      - name: Dry run of the web profile on Ubuntu 26.04
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:26.04 sh -c '
            apt-get update -qq >/dev/null && apt-get install -y -qq curl >/dev/null
            sh scripts/install.sh --dry-run --profile web --version v0.0.0-ci
          '

      - name: Refuses Ubuntu 26.04 arm64 before validation
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:26.04 sh -c '
            apt-get update -qq >/dev/null && apt-get install -y -qq curl >/dev/null
            mkdir -p /tmp/nubit-mock-bin
            printf "%s\n" "#!/bin/sh" "[ \"\$1\" = -m ] && { printf \"%s\\n\" aarch64; exit 0; }" "exec /bin/uname \"\$@\"" > /tmp/nubit-mock-bin/uname
            chmod 0755 /tmp/nubit-mock-bin/uname
            if PATH="/tmp/nubit-mock-bin:$PATH" sh scripts/install.sh --dry-run --profile web --version v0.0.0-ci; then
              echo "Ubuntu 26.04 arm64 was accepted" >&2
              exit 1
            fi
            echo "correctly refused"
          '

      - name: Refuses Debian 12 arm64 before validation
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12-slim sh -c '
            apt-get update -qq >/dev/null && apt-get install -y -qq curl >/dev/null
            mkdir -p /tmp/nubit-mock-bin
            printf "%s\n" "#!/bin/sh" "[ \"\$1\" = -m ] && { printf \"%s\\n\" aarch64; exit 0; }" "exec /bin/uname \"\$@\"" > /tmp/nubit-mock-bin/uname
            chmod 0755 /tmp/nubit-mock-bin/uname
            if PATH="/tmp/nubit-mock-bin:$PATH" sh scripts/install.sh --dry-run --profile web --version v0.0.0-ci; then
              echo "Debian 12 arm64 was accepted" >&2
              exit 1
            fi
            echo "correctly refused"
          '

      - name: Install the web profile on Ubuntu 26.04
        run: sh scripts/test-installer-ubuntu2604-docker.sh

      # A host the agent does not support must be refused, not half-installed.
      - name: Refuses an unsupported distribution
        run: |
          if sudo sh scripts/install.sh --dry-run --profile web --version v0.0.0-ci; then
            echo "the web profile installed on an unsupported distribution" >&2
            exit 1
          fi
          echo "correctly refused"
