name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The agent ships as a static binary so it runs on any Debian 12 host
      # without a runtime dependency to keep in sync.
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/nubit-agent

  scripts:
    name: Installer script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse with sh
        run: sh -n scripts/install.sh

      - name: ShellCheck
        run: shellcheck --shell=sh scripts/install.sh

      # --dry-run must never touch the machine, so it is safe to exercise in CI
      # and proves the argument parsing and platform detection still work. The
      # version is pinned so the check does not depend on a release existing.
      - name: Dry run
        run: sudo sh scripts/install.sh --dry-run --profile web --version v0.0.0-ci
